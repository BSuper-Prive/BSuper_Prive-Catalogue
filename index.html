    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #0d0d0d;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --text-main: #ffffff;
            --text-sub: #a0a0a0;
            --border-gold: #c5a059;
            --border-dark: #1f1f1f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            text-align: center;
            padding: 25px 0 15px;
            border-bottom: 1px solid var(--border-gold);
            margin-bottom: 15px;
        }

        .brand-logo-img {
            width: 180px;
            height: auto;
            max-width: 80%;
            display: block;
            margin: 0 auto 12px auto;
            object-fit: contain;
            mix-blend-mode: screen;
        }

        .header h2 {
            color: var(--gold-primary);
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin: 0;
            font-weight: 500;
        }

        .controls-container {
            position: sticky;
            top: 0;
            background-color: var(--bg-dark);
            padding: 10px 0;
            z-index: 1000;
            border-bottom: 1px solid var(--border-dark);
        }

        .search-box {
            width: 100%;
            padding: 14px 16px;
            background-color: #121212;
            border: 1px solid var(--border-gold);
            border-radius: 6px;
            color: #ffffff;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        .search-box::placeholder {
            color: var(--text-sub);
        }

        .category-bar {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-top: 10px;
            scrollbar-width: none;
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background-color: #1a1a1a;
            border: 1px solid var(--border-dark);
            color: var(--text-sub);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            white-space: nowrap;
            cursor: pointer;
        }

        .chip.active {
            background-color: var(--gold-primary);
            color: #000000;
            border-color: var(--gold-primary);
            font-weight: 700;
        }

        .stats-bar {
            font-size: 11px;
            color: var(--text-sub);
            padding: 12px 0 6px 2px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .catalog-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
        }

        .catalog-table th {
            background-color: #141414;
            color: var(--gold-primary);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border-gold);
        }

        .catalog-table td {
            padding: 12px 8px;
            border-bottom: 1px solid var(--border-dark);
            font-size: 12px;
            vertical-align: middle;
        }

        .fragrance-name {
            font-weight: 600;
            color: var(--text-main);
            font-size: 13px;
        }

        .fragrance-category {
            font-size: 9px;
            color: var(--gold-light);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .family-badge {
            display: inline-block;
            background-color: #1a1a1a;
            color: var(--gold-light);
            border: 1px solid var(--border-dark);
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .profile-badge {
            display: inline-block;
            background-color: #1c1a14;
            color: var(--gold-primary);
            border: 1px solid var(--border-gold);
            font-size: 9px;
            padding: 3px 6px;
            border-radius: 3px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .price-text {
            color: var(--gold-primary);
            font-weight: 700;
            font-size: 12px;
            text-align: right;
            white-space: nowrap;
        }

        .no-results {
            text-align: center;
            color: var(--text-sub);
            padding: 40px;
            font-size: 12px;
            display: none;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

        let currentCategory = 'All';

        function renderCatalog(items) {
            const body = document.getElementById('catalogBody');
            const noResults = document.getElementById('noResults');
            const resultCount = document.getElementById('resultCount');
            
            body.innerHTML = '';

            if (items.length === 0) {
                noResults.style.display = 'block';
                resultCount.innerText = '0 oils found';
                return;
            }

            noResults.style.display = 'none';
            resultCount.innerText = `${items.length} Fragrance Oils Listed`;

            items.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div class="fragrance-name">${item.name}</div>
                        <div class="fragrance-category">${item.category} Collection</div>
                    </td>
                    <td>
                        <span class="family-badge">${item.family}</span>
                    </td>
                    <td>
                        <span class="profile-badge">${item.profile}</span>
                    </td>
                    <td class="price-text">${item.price}</td>
                `;
                body.appendChild(row);
            });
        }

        function filterCatalog() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            const filtered = catalogData.filter(item => {
                const matchesCategory = (currentCategory === 'All') || (item.category === currentCategory);
                const matchesSearch = item.name.toLowerCase().includes(query) || 
                                      item.family.toLowerCase().includes(query) || 
                                      item.profile.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            renderCatalog(filtered);
        }

        function setCategory(cat, element) {
            currentCategory = cat;
            document.querySelectorAll('.chip').forEach(chip => chip.classList.remove('active'));
            element.classList.add('active');
            filterCatalog();
        }

        renderCatalog(catalogData);
